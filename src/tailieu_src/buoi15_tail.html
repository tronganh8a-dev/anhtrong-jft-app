</div><canvas id="pen"></canvas><div id="ann"></div>
<div id="bar"><button onclick="back()" title="Lùi (←)">◀</button><span id="cnt"></span><button onclick="step()" title="Tiếp (→ / Space): hiện giải thích từng phần rồi sang slide">▶</button><button onclick="all1()" title="Hiện hết giải thích (A)">Hiện hết</button><button id="bAns" class="pri" onclick="ans()">Đáp án</button><button data-m="pen" onclick="mode('pen')" title="Bút (P)">✎ Bút</button><button data-m="text" onclick="mode('text')" title="Gõ chữ (T)">T Chữ</button><button data-m="memo" onclick="mode('memo')" title="Giấy ghi chú (M)">▤ Memo</button><button onclick="clr()" title="Xoá nét, chữ, memo">Xoá</button></div>
<script>const S=[...document.querySelectorAll('.slide')];let cur=+(location.hash.slice(1)||0);const st=document.getElementById('stage');let M='';
function fit(){const k=Math.min(innerWidth/1600,innerHeight/900);st.style.transform=`translate(-50%,-50%) scale(${k})`}addEventListener('resize',fit);fit();
function show(i,full){cur=Math.max(0,Math.min(S.length-1,i));S.forEach((s,k)=>s.classList.toggle('on',k===cur));S[cur].querySelectorAll('.st').forEach(e=>e.classList.toggle('sh',!!full));document.getElementById('cnt').textContent=(cur+1)+' / '+S.length;history.replaceState(0,'','#'+cur);document.getElementById('bAns').style.visibility=S[cur].classList.contains('qz')?'':'hidden';clr()}
function step(){const n=S[cur].querySelector('.st:not(.sh)');if(n){n.classList.add('sh');return}if(S[cur].classList.contains('qz')&&!S[cur].querySelector('.opts.show')){ans();return}show(cur+1)}
function back(){show(cur-1,true)}function all1(){S[cur].querySelectorAll('.st').forEach(e=>e.classList.add('sh'))}
document.querySelectorAll('.kc').forEach(c=>c.onclick=()=>{if(!M){const x=c.querySelector('.st');x&&x.classList.add('sh')}});
function ans(){const s=S[cur];const o=s.querySelector('.opts');if(!o)return;o.classList.add('show');o.querySelectorAll('.o').forEach(b=>b.classList.toggle('ok',b.dataset.k===o.dataset.a));s.querySelector('.ex').classList.add('on')}
document.querySelectorAll('.opts').forEach(o=>{const v={};o.querySelectorAll('.o').forEach(b=>b.onclick=()=>{if(o.classList.contains('show')||M)return;v[b.dataset.k]=(v[b.dataset.k]||0)+1;const n=Object.values(v).reduce((a,c)=>a+c,0);o.querySelectorAll('.o').forEach(x=>{const c=v[x.dataset.k]||0;x.querySelector('i').style.width=(c/n*100)+'%';x.querySelector('em').textContent=c?c+' phiếu':''})})});
const editing=()=>{const a=document.activeElement;return a&&(a.isContentEditable||/INPUT|TEXTAREA/.test(a.tagName))};
addEventListener('keydown',e=>{if(editing()){if(e.key==='Escape')document.activeElement.blur();return}
 if(['ArrowRight',' ','PageDown','ArrowDown'].includes(e.key)){e.preventDefault();step()}else if(['ArrowLeft','PageUp','ArrowUp'].includes(e.key)){e.preventDefault();back()}
 else if(e.key==='Enter')ans();else if(e.key==='a')all1();else if(e.key==='p')mode('pen');else if(e.key==='t')mode('text');else if(e.key==='m')mode('memo');else if(e.key==='Escape')mode('');else if(e.key==='Delete')clr();
 else if(e.key==='f')(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}))});
const cv=document.getElementById('pen'),cx=cv.getContext('2d'),A=document.getElementById('ann');function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function clr(){cx.clearRect(0,0,cv.width,cv.height);A.innerHTML=''}
function mode(m){M=M===m?'':m;['pen','text','memo'].forEach(k=>document.body.classList.toggle('m-'+k,M===k));document.body.classList.toggle('pen',M==='pen');document.querySelectorAll('#bar [data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===M))}
function addText(x,y){const d=document.createElement('div');d.className='ntx';d.contentEditable='true';d.style.left=x+'px';d.style.top=(y-24)+'px';A.appendChild(d);setTimeout(()=>d.focus(),60);d.addEventListener('blur',()=>{if(!d.textContent.trim())d.remove()})}
function addMemo(x,y){const d=document.createElement('div');d.className='nmm';d.style.left=x+'px';d.style.top=y+'px';d.innerHTML='<div class="gr"></div><span class="xx" title="Xoá memo">✕</span><div class="tx" contenteditable="true"></div>';A.appendChild(d);const t=d.querySelector('.tx');setTimeout(()=>t.focus(),60);
 d.querySelector('.xx').onclick=()=>d.remove();const g=d.querySelector('.gr');g.addEventListener('pointerdown',e=>{e.preventDefault();const ox=e.clientX-d.offsetLeft,oy=e.clientY-d.offsetTop;const mv=ev=>{d.style.left=(ev.clientX-ox)+'px';d.style.top=(ev.clientY-oy)+'px'},up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)})}
let dn=0;cv.addEventListener('pointerdown',e=>{if(M==='text'||M==='memo')e.preventDefault();if(M==='text'){addText(e.clientX,e.clientY);return}if(M==='memo'){addMemo(e.clientX,e.clientY);mode('');return}dn=1;cx.beginPath();cx.moveTo(e.clientX,e.clientY)});cv.addEventListener('pointermove',e=>{if(!dn)return;cx.lineTo(e.clientX,e.clientY);cx.strokeStyle='#e0245e';cx.lineWidth=4;cx.lineCap='round';cx.lineJoin='round';cx.stroke()});addEventListener('pointerup',()=>dn=0);
show(cur);</script></body></html>
