<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · Anh Trọng Dạy JFT</title><meta name="robots" content="noindex"><link rel="icon" href="/app/media/brand/icon.svg" type="image/svg+xml"><link rel="icon" href="/app/media/brand/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="/app/media/brand/apple-touch-icon.png"><meta name="theme-color" content="#0d5a8c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Segoe UI",system-ui,sans-serif;color:#17222c;background:#f3f6f8;min-height:100vh;-webkit-text-size-adjust:100%}
.jp{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif}
header{background:linear-gradient(140deg,#0b3d60 0%,#0d5a8c 55%,#0a4670 100%);color:#fff;padding:18px 16px 22px}
.wrap{max-width:760px;margin:0 auto}
.brand img{display:block;width:170px;height:auto}
.logo{width:34px;height:34px;border-radius:9px;background:#c42f66;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
header h1{margin:14px 0 4px;font-size:26px;font-weight:800}
header p{margin:0;color:#d4e6f3;font-size:14px}
main{padding:16px 16px 110px}
.card{background:#fff;border:1px solid #e3e9ee;border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(13,40,60,.06)}
.start label{display:block;font-weight:700;font-size:14px;margin:4px 0 8px}
.start input{width:100%;border:1.5px solid #dbe2e7;border-radius:12px;padding:13px 14px;font:inherit;font-size:17px;background:#f8fafb}
.start input:focus{outline:0;border-color:#0d5a8c;background:#fff;box-shadow:0 0 0 4px rgba(13,90,140,.12)}
.info{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.info span{background:#eef4f8;color:#0d5a8c;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.btn{border:0;border-radius:12px;background:linear-gradient(135deg,#0d5a8c,#0a4670);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:14px 20px;cursor:pointer;box-shadow:0 8px 20px rgba(13,90,140,.25)}
.btn:disabled{opacity:.55;cursor:default}
.btn.full{width:100%;margin-top:14px}
.btn.ghost{background:#fff;color:#0d5a8c;border:1.5px solid #0d5a8c;box-shadow:none}
.err{color:#b3261e;font-size:14px;font-weight:700;min-height:18px;margin-top:10px}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2{margin:0;font-size:19px}
.sec small{color:#5a6873;font-size:13.5px}
.q{background:#fff;border:1px solid #e3e9ee;border-radius:14px;padding:16px;margin-bottom:12px}
.qn{display:inline-block;background:#0d5a8c;color:#fff;border-radius:8px;padding:2px 9px;font-size:13px;font-weight:700;margin-bottom:10px}
.sent{font-size:21px;line-height:1.9}
.sent u{text-decoration-thickness:2px;text-underline-offset:6px}
.sent rt{font-size:.5em;color:#5a6873}
.mean{font-size:20px;font-weight:700;color:#c42f66}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ops.long{grid-template-columns:1fr}
.op{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid #dbe2e7;border-radius:12px;background:#fff;padding:11px 12px;font:inherit;font-size:18px;color:inherit;cursor:pointer;min-height:52px}
.op i{width:20px;height:20px;border-radius:50%;border:2px solid #9aa6b0;flex:none;position:relative}
.op.sel{border-color:#0d5a8c;background:#eef5fb}
.op.sel i{border-color:#0d5a8c}.op.sel i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#0d5a8c}
.op rt{font-size:.5em;color:#5a6873}
.done .op{cursor:default}
.op.ok{border-color:#2e8b4a;background:#ecf8f0}.op.ok i{border-color:#2e8b4a}.op.ok i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#2e8b4a}
.op.bad{border-color:#c0392b;background:#fdeeee}.op.bad i{border-color:#c0392b}.op.bad i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#c0392b}
.mark{float:right;font-weight:800;font-size:13px;border-radius:8px;padding:3px 9px}
.mark.y{background:#ecf8f0;color:#2e8b4a}.mark.n{background:#fdeeee;color:#c0392b}.mark.s{background:#fff4e0;color:#a5650b}
.ex{margin-top:12px;background:#f6f8fa;border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.65;color:#33424f}
.ex b{color:#17222c}.ex rt{font-size:.55em}
.hv{color:#b5402a;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e3e9ee;padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(13,40,60,.08)}
.bar .wrap{display:flex;align-items:center;gap:12px}
.prog{flex:1;min-width:0}
.prog div{font-size:13.5px;font-weight:700;margin-bottom:5px}
.track{height:8px;border-radius:99px;background:#e6ecf0;overflow:hidden}.track i{display:block;height:100%;width:0;background:#c42f66;transition:width .2s}
.score{text-align:center}
.score .big{font-size:56px;font-weight:800;color:#0d5a8c;line-height:1.1}
.score .big small{font-size:24px;color:#5a6873}
.score .who{color:#5a6873;font-size:14px;margin-top:4px}
.secs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.secs div{background:#f3f6f8;border-radius:12px;padding:10px 6px;font-size:13px;color:#5a6873}
.secs b{display:block;font-size:20px;color:#17222c}
.sent-ok{margin-top:12px;color:#2e8b4a;font-weight:700;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(10,30,45,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.modal .card{max-width:380px;width:100%}
.modal h3{margin:0 0 6px;font-size:18px}.modal p{margin:0 0 14px;color:#5a6873;font-size:14.5px}
.row{display:flex;gap:8px}.row .btn{flex:1}
footer{color:#9aa6b0;font-size:12px;text-align:center;margin-top:26px}
@media (max-width:520px){.ops{grid-template-columns:1fr}.sent{font-size:19px}header h1{font-size:22px}}
</style></head><body>
<header><div class="wrap"><div class="brand"><img src="/app/media/brand/logo-ngang-trang.svg" alt="Anh Trọng Dạy JFT" width="224" height="57"></div><h1 id="ttl"></h1><p id="sub"></p></div></header>
<main><div class="wrap" id="app"></div><footer>© 2026 Anh Trọng Dạy JFT · Facebook: Anh Trọng · TikTok: @anhtrong.daygino</footer></main>
<div class="bar" id="bar" hidden><div class="wrap"><div class="prog"><div id="cnt"></div><div class="track"><i id="trk"></i></div></div><button class="btn" id="go">Nộp bài</button></div></div>
<div class="modal" id="mdl"><div class="card"><h3>Nộp bài?</h3><p id="mtxt"></p><div class="row"><button class="btn ghost" id="mno">Làm tiếp</button><button class="btn" id="myes">Nộp luôn</button></div></div></div>
<script>
const T=__DATA__;
const app=document.getElementById('app'),$=id=>document.getElementById(id);
const KEY='kt_'+T.id;
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const QS=[];T.secs.forEach((s,si)=>s.qs.forEach(q=>QS.push(Object.assign({si},q))));
const N=QS.length;
let st=ls.get(KEY)||{};
let name=st.name||'',ans=Array.isArray(st.ans)&&st.ans.length===N?st.ans:Array(N).fill(-1),t0=st.t0||0,sending=false;
const save=()=>ls.set(KEY,{name,ans,t0});
$('ttl').textContent=T.title;$('sub').textContent=T.sub;document.title=T.title+' · Anh Trọng Dạy JFT';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function start(){
  bar.hidden=true;
  app.innerHTML=`<div class="card start"><div class="info"><span>${N} câu</span>${T.secs.map(s=>`<span>${s.name}: ${s.qs.length}</span>`).join('')}</div>
  <label for="nm">Họ và tên của bạn</label><input id="nm" maxlength="60" autocomplete="name" placeholder="Ví dụ: Nguyễn Văn An" value="${esc(name)}">
  <div class="err" id="e1"></div><button class="btn full" id="b1">Bắt đầu làm bài</button></div>`;
  const go=()=>{const v=$('nm').value.trim().replace(/\s+/g,' ');if(v.length<2){$('e1').textContent='Bạn nhập họ tên để thầy biết bài của ai nhé.';$('nm').focus();return}
    name=v;if(!t0)t0=Date.now();save();quiz()};
  $('b1').onclick=go;$('nm').onkeydown=e=>{if(e.key==='Enter')go()};
}
const bar=$('bar');
function quiz(){
  let h=`<div class="card" style="padding:12px 16px;font-size:14px">Thí sinh: <b>${esc(name)}</b> · <a href="#" id="chg" style="color:#0d5a8c">đổi tên</a></div>`,n=0;
  T.secs.forEach((s,si)=>{h+=`<div class="sec"><h2>${si+1}. ${s.name}</h2><small>${s.ins}</small></div>`;
    s.qs.forEach(q=>{const i=n++;const long=q.o.some(o=>o.replace(/<rt>.*?<\/rt>|<[^>]+>/g,'').length>9);
      h+=`<div class="q" id="q${i}"><span class="qn">Câu ${i+1}</span>${q.q}<div class="ops${long?' long':''}">${q.o.map((o,j)=>`<button class="op jp${ans[i]===j?' sel':''}" data-i="${i}" data-j="${j}"><i></i><span>${o}</span></button>`).join('')}</div></div>`})});
  h+=`<div class="err" id="e2"></div>`;
  app.innerHTML=h;bar.hidden=false;upd();
  $('chg').onclick=e=>{e.preventDefault();start()};
  app.onclick=e=>{const b=e.target.closest('.op');if(!b||sending)return;const i=+b.dataset.i,j=+b.dataset.j;ans[i]=j;save();
    b.parentNode.querySelectorAll('.op').forEach(x=>x.classList.toggle('sel',x===b));upd()};
}
function upd(){const d=ans.filter(x=>x>=0).length;$('cnt').textContent=`Đã làm ${d}/${N} câu`;$('trk').style.width=(d/N*100)+'%'}
$('go').onclick=()=>{const left=ans.filter(x=>x<0).length;
  $('mtxt').textContent=left?`Bạn còn ${left} câu chưa làm. Câu bỏ trống sẽ tính là sai.`:'Bạn đã làm hết các câu. Nộp bài để xem điểm và giải thích.';
  $('mdl').classList.add('on')};
$('mno').onclick=()=>{$('mdl').classList.remove('on');const i=ans.indexOf(-1);if(i>=0)$('q'+i).scrollIntoView({behavior:'smooth',block:'center'})};
$('myes').onclick=submit;
async function submit(){
  $('mdl').classList.remove('on');if(sending)return;sending=true;$('go').disabled=true;$('go').textContent='Đang nộp…';$('e2').textContent='';
  try{
    const r=await fetch('/api/kiemtra/nop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({test:T.id,name,ans,dur:Math.round((Date.now()-(t0||Date.now()))/1000)})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok)throw new Error(d.error||('Lỗi máy chủ '+r.status));
    ls.del(KEY);result(d);
  }catch(e){sending=false;$('go').disabled=false;$('go').textContent='Nộp bài';$('e2').textContent='Chưa nộp được: '+e.message+'. Kiểm tra mạng rồi bấm Nộp bài lại (bài làm vẫn được giữ).';$('e2').scrollIntoView({block:'center'})}
}
function result(d){
  bar.hidden=true;window.scrollTo(0,0);
  let h=`<div class="card score"><div class="big">${d.score}<small> / ${d.total}</small></div><div class="who">${esc(name)} · đã nộp bài cho thầy</div>
  <div class="secs">${d.secs.map(s=>`<div><b>${s.c}/${s.n}</b>${s.name}</div>`).join('')}</div>
  <div class="sent-ok">✓ Bài làm đã được gửi. Xem lại đáp án và giải thích bên dưới.</div></div>`;let n=0;
  T.secs.forEach((s,si)=>{h+=`<div class="sec"><h2>${si+1}. ${s.name}</h2></div>`;
    s.qs.forEach(q=>{const i=n++,k=d.key[i],a=ans[i];const long=q.o.some(o=>o.replace(/<rt>.*?<\/rt>|<[^>]+>/g,'').length>9);
      const m=a<0?'<span class="mark s">Bỏ trống</span>':a===k.a?'<span class="mark y">Đúng</span>':'<span class="mark n">Sai</span>';
      h+=`<div class="q done">${m}<span class="qn">Câu ${i+1}</span>${q.q}<div class="ops${long?' long':''}">${q.o.map((o,j)=>`<div class="op jp${j===k.a?' ok':j===a?' bad':''}"><i></i><span>${o}</span></div>`).join('')}</div><div class="ex">${k.ex}</div></div>`})});
  h+=`<button class="btn full ghost" id="again">Làm lại từ đầu</button>`;
  app.innerHTML=h;app.onclick=null;
  $('again').onclick=()=>{ans=Array(N).fill(-1);t0=Date.now();sending=false;$('go').disabled=false;$('go').textContent='Nộp bài';save();quiz();window.scrollTo(0,0)};
}
name?quiz():start();
</script></body></html>
