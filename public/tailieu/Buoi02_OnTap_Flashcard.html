<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn tập Buổi 2 · Flashcard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f8;--paper:#fff;--ink:#17222c;--muted:#5d6b77;--line:#dde4ea;--blue:#0d5a8c;--blue-soft:#e6f0f7;--pink:#c42f66;--pink-soft:#fbe6ee;--ok:#1d7a4b;--ok-soft:#e2f4ea;--ng:#b3261e;--ng-soft:#fbe9e7;
 --jp:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;--vi:"Quicksand","Segoe UI",system-ui,sans-serif;--mix:"Quicksand","Klee One",sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--vi);-webkit-tap-highlight-color:transparent}
.jp{font-family:var(--jp)}.mix{font-family:var(--mix)}
ruby rt{font-family:var(--jp);font-size:.45em;color:var(--muted)}
button{font:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:22px 18px 40px}
.top{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.top b{font-size:17px}.top small{display:block;color:var(--muted);font-weight:600;font-size:13px}
h1{font-size:30px;margin:20px 0 4px;letter-spacing:-.01em}
.lead{color:var(--muted);font-weight:600;margin:0 0 18px;font-size:15px}
.decks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.dk{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14.5px;color:var(--ink)}
.dk i{width:10px;height:10px;border-radius:50%;flex:none}.dk span{color:var(--muted);font-weight:700;font-size:12.5px}
.dk.on{border-color:var(--ink);background:var(--ink);color:#fff}.dk.on span{color:#c9d3dc}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:#e3e9ee;border-radius:11px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 12px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tg{border:1.5px solid var(--line);background:var(--paper);border-radius:11px;padding:7px 12px;font-weight:700;font-size:13.5px;color:var(--muted)}
.tg.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-weight:700;font-size:14px;color:var(--muted)}
.bar{flex:1;height:8px;background:#e0e6eb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ec6f9b,#f2a93b,#f2cf2a,#9cc443);width:0;transition:width .3s}
.cnt b{color:var(--ink)}.cnt .k{color:var(--ok)}.cnt .n{color:var(--ng)}
/* thẻ */
.scene{perspective:1600px}
.card{display:grid;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer;min-height:380px;touch-action:pan-y}
.card.flip{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border-radius:24px;border:1px solid var(--line);box-shadow:0 18px 40px -22px rgba(13,40,60,.35);padding:22px 26px 26px;display:flex;flex-direction:column}
.back{transform:rotateY(180deg)}
.ftop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{color:#fff;border-radius:99px;padding:4px 12px;font-weight:700;font-size:12.5px}
.src{color:var(--muted);font-weight:700;font-size:12.5px}
.no{margin-left:auto;color:var(--muted);font-weight:700;font-size:12.5px}
.fmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:18px 0 4px}
.fw{font-family:var(--jp);font-size:64px;line-height:1.35;font-weight:600;word-break:keep-all}
.fw.m{font-size:48px}.fw.l{font-size:36px}.fw.g{font-family:var(--mix);font-size:30px;line-height:1.5}
.nofuri .face.front rt{visibility:hidden}
.fvi{font-size:34px;font-weight:700;line-height:1.3}
.hint{color:var(--muted);font-size:13px;font-weight:600}
.pic{width:170px;height:170px;object-fit:contain;border-radius:16px;background:#fafbfc;border:1px solid var(--line)}
.pic.s{width:120px;height:120px}
.bw{display:flex;gap:18px;align-items:center;margin-top:10px}
.bw .t{flex:1;min-width:0}
.bword{font-family:var(--jp);font-size:44px;font-weight:600;line-height:1.4}.bword.g{font-family:var(--mix);font-size:26px;line-height:1.5}
.bread{font-family:var(--jp);font-size:20px;color:var(--muted)}
.hv{font-weight:800;letter-spacing:.08em;color:var(--pink);font-size:15px;margin-top:2px}
.bvi{font-size:26px;font-weight:700;margin-top:4px;line-height:1.35}
.blk{margin-top:14px;background:#f6f8fa;border-radius:14px;padding:12px 16px}
.blk .lb{font-size:11.5px;letter-spacing:.1em;font-weight:800;color:var(--blue);text-transform:uppercase;margin-bottom:4px}
.blk .ej{font-family:var(--mix);font-size:19px;line-height:1.75}
.blk .ev{color:var(--muted);font-weight:600;font-size:14.5px}
.blk.tip{background:#fff8e6;color:#5a4300;font-weight:600;font-size:14.5px;line-height:1.5}
.st{font-family:var(--mix);font-size:17px;line-height:1.7}
/* nút */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.acts button{border:0;border-radius:16px;padding:15px 10px;font-weight:800;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.bflip{grid-column:1/-1;background:var(--blue);color:#fff}
.bng{background:var(--ng-soft);color:var(--ng)}.bok{background:var(--ok-soft);color:var(--ok)}
.acts kbd{font-family:var(--vi);font-size:11px;border:1px solid currentColor;border-radius:5px;padding:1px 5px;opacity:.6}
.small{display:flex;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:13px;font-weight:600}
.small button{border:0;background:none;color:var(--blue);font-weight:700;padding:0}
/* kết quả */
.res{background:var(--paper);border-radius:24px;border:1px solid var(--line);padding:28px 26px;text-align:center;box-shadow:0 18px 40px -22px rgba(13,40,60,.35)}
.ring{width:150px;height:150px;border-radius:50%;margin:4px auto 14px;display:grid;place-items:center;font-size:38px;font-weight:800}
.ring span{width:118px;height:118px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.res h2{margin:0 0 6px;font-size:24px}.res p{color:var(--muted);font-weight:600;margin:0 0 16px}
.rows{display:grid;gap:6px;text-align:left;margin:16px 0;max-height:340px;overflow:auto}
.rw{display:flex;align-items:center;gap:12px;background:#f6f8fa;border-radius:12px;padding:8px 12px}
.rw .w{font-family:var(--jp);font-size:20px;font-weight:600;min-width:110px}.rw .v{font-weight:600;font-size:14px;color:var(--muted)}
.rbt{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rbt button{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px}
.rbt .p{background:var(--blue);color:#fff}.rbt .s{background:#e3e9ee;color:var(--ink)}
.foot{margin-top:26px;color:var(--muted);font-size:12px;text-align:center;font-weight:600}
@media (max-width:600px){
 .wrap{padding:14px 12px 30px}h1{font-size:22px;margin:12px 0 10px}.lead{display:none}
 .decks{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px 10px;padding:0 12px 2px;scrollbar-width:none}.decks::-webkit-scrollbar{display:none}.dk{flex:none}
 .opts{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px 12px;padding:0 12px;scrollbar-width:none}.opts::-webkit-scrollbar{display:none}.seg,.tg{flex:none}.seg button,.tg{font-size:12.5px;padding:6px 10px}
 .dk{padding:7px 10px;font-size:13.5px}.card{min-height:340px}.face{padding:16px 16px 20px;border-radius:20px}
 .fw{font-size:50px}.fw.m{font-size:38px}.fw.l{font-size:28px}.fw.g{font-size:23px}.fvi{font-size:27px}
 .bword{font-size:34px}.bword.g{font-size:21px}.bvi{font-size:21px}.pic{width:130px;height:130px}.pic.s{width:86px;height:86px}
 .small span{display:none}.blk .ej{font-size:17px}.acts button{padding:14px 8px;font-size:15.5px}.acts kbd{display:none}
}
</style></head><body>
<div class="wrap" id="app">
 <div class="top"><span class="logo">AT</span><div><b>Anh Trọng Dạy JFT</b><small>Khoá cấp tốc · Buổi 2</small></div></div>
 <h1>Ôn tập Buổi 2 · Flashcard</h1>
 <p class="lead">Nhìn thẻ, tự nhớ cách đọc và nghĩa → lật thẻ → tự chấm <b>Đã nhớ</b> hoặc <b>Chưa nhớ</b>.</p>
 <div class="decks" id="decks"></div>
 <div class="opts"><div class="seg" id="side"><button data-s="jp" class="on">Mặt trước: tiếng Nhật</button><button data-s="vi">Mặt trước: tiếng Việt</button></div>
  <button class="tg" id="tFuri" type="button">ふりがな mặt trước</button><button class="tg on" id="tShuf" type="button">Trộn thẻ</button></div>
 <div id="main"></div>
 <div class="foot">© 2026 Anh Trọng Dạy JFT · Kiến thức buổi 2: chữ Hán, từ vựng, ngữ pháp, từ trong bài đọc hiểu và nghe hiểu (theo 『いろどり 生活の日本語』)</div>
</div>
<script>
const CARDS=[{"d": "kanji", "src": "Chữ Hán 入門 1–20", "w": "<ruby>名前<rt>なまえ</rt></ruby>", "r": "なまえ", "hv": "DANH TIỀN", "vi": "Tên", "ex": "ここに<ruby>名前<rt>なまえ</rt></ruby>を<ruby>書<rt>か</rt></ruby>いてください。", "exv": "Hãy viết tên vào đây.", "tip": "Mẹo nhớ: 名 = 夕 (buổi tối) + 口 (miệng) — trời tối không nhìn thấy mặt nên phải gọi tên.", "id": 0}, {"d": "kanji", "src": "Chữ Hán 入門 1–20", "w": "<ruby>国<rt>くに</rt></ruby>", "r": "くに", "hv": "QUỐC", "vi": "Đất nước", "ex": "<ruby>私<rt>わたし</rt></ruby>の<ruby>国<rt>くに</rt></ruby>はベトナムです。", "exv": "Đất nước của tôi là Việt Nam.", "tip": "Mẹo nhớ: khung 囗 là biên giới bao quanh, bên trong là 玉 (ngọc) — đất nước quý như ngọc.", "id": 1}, {"d": "kanji", "src": "Chữ Hán 入門 1–20", "w": "<ruby>私<rt>わたし</rt></ruby>", "r": "わたし", "hv": "TƯ", "vi": "Tôi", "ex": "<ruby>私<rt>わたし</rt></ruby>はベトナム<ruby>人<rt>じん</rt></ruby>です。", "exv": "Tôi là người Việt Nam.", "tip": "Giao tiếp thường đọc わたし; わたくし lịch sự hơn. Âm On シ gặp trong 私立 (しりつ: tư lập).", "id": 2}, {"d": "kanji", "src": "Chữ Hán 入門 1–20", "w": "<ruby>父<rt>ちち</rt></ruby>", "r": "ちち", "hv": "PHỤ", "vi": "Bố", "ex": "<ruby>父<rt>ちち</rt></ruby>は<ruby>会社員<rt>かいしゃいん</rt></ruby>です。", "exv": "Bố tôi là nhân viên công ty.", "tip": "Nói về bố mình với người khác dùng 父 (ちち); gọi bố người khác là お父さん (おとうさん) — cách đọc đặc biệt.", "id": 3}, {"d": "kanji", "src": "Chữ Hán 入門 1–20", "w": "<ruby>母<rt>はは</rt></ruby>", "r": "はは", "hv": "MẪU", "vi": "Mẹ", "ex": "<ruby>母<rt>はは</rt></ruby>は<ruby>料理<rt>りょうり</rt></ruby>が<ruby>上手<rt>じょうず</rt></ruby>です。", "exv": "Mẹ tôi nấu ăn giỏi.", "tip": "Mẹo nhớ: hai chấm bên trong chữ như bầu sữa mẹ. Mẹ người khác gọi là お母さん (おかあさん).", "id": 4}, {"d": "kanji", "src": "Chữ Hán 入門 1–20", "w": "<ruby>子<rt>こ</rt></ruby>ども", "r": "こども", "hv": "TỬ", "vi": "Con cái", "ex": "<ruby>子<rt>こ</rt></ruby>どもが<ruby>二人<rt>ふたり</rt></ruby>います。", "exv": "Tôi có hai đứa con.", "tip": "子 trông như em bé giơ hai tay. Thường viết ども bằng hiragana; dạng đầy đủ là 子供.", "id": 5}, {"d": "kanji", "src": "Chữ Hán 入門 1–20", "w": "<ruby>日本<rt>にほん</rt></ruby>", "r": "にほん", "hv": "NHẬT BẢN", "vi": "Nhật Bản", "ex": "<ruby>日本<rt>にほん</rt></ruby>で<ruby>働<rt>はたら</rt></ruby>きたいです。", "exv": "Tôi muốn làm việc ở Nhật Bản.", "tip": "日 (mặt trời) + 本 (gốc): 'gốc của mặt trời' — nơi mặt trời mọc. Đọc にほん hoặc にっぽん.", "id": 6}, {"d": "kanji", "src": "Chữ Hán 入門 1–20", "w": "<ruby>水<rt>みず</rt></ruby>", "r": "みず", "hv": "THỦY", "vi": "Nước", "ex": "<ruby>水<rt>みず</rt></ruby>をください。", "exv": "Cho tôi xin nước.", "tip": "Hình dòng nước chảy ở giữa, tia nước bắn hai bên. Trong 水曜日 (thứ Tư) đọc âm On すい.", "id": 7}, {"d": "kanji", "src": "Chữ Hán 入門 1–20", "w": "<ruby>食<rt>た</rt></ruby>べます", "r": "たべます", "hv": "THỰC", "vi": "Ăn", "ex": "<ruby>毎朝<rt>まいあさ</rt></ruby>パンを<ruby>食<rt>た</rt></ruby>べます。", "exv": "Sáng nào tôi cũng ăn bánh mì.", "tip": "Okurigana: 食べます (た + べます). Âm On ショク gặp trong 食堂 (しょくどう: nhà ăn).", "id": 8}, {"d": "kanji", "src": "Chữ Hán 入門 1–20", "w": "<ruby>飲<rt>の</rt></ruby>みます", "r": "のみます", "hv": "ẨM", "vi": "Uống", "ex": "コーヒーを<ruby>飲<rt>の</rt></ruby>みます。", "exv": "Tôi uống cà phê.", "tip": "Bên trái là bộ 食 (ăn), bên phải là 欠 (người há miệng) — há miệng để uống.", "id": 9}, {"d": "kanji", "src": "Chữ Hán 入門 1–20", "w": "<ruby>魚<rt>さかな</rt></ruby>", "r": "さかな", "hv": "NGƯ", "vi": "Cá", "ex": "<ruby>私<rt>わたし</rt></ruby>は<ruby>魚<rt>さかな</rt></ruby>が<ruby>好<rt>す</rt></ruby>きです。", "exv": "Tôi thích cá.", "tip": "Hình con cá: phần trên là đầu, giữa là thân vảy, bốn chấm dưới là đuôi.", "id": 10}, {"d": "kanji", "src": "Chữ Hán 入門 1–20", "w": "<ruby>肉<rt>にく</rt></ruby>", "r": "にく", "hv": "NHỤC", "vi": "Thịt", "ex": "<ruby>晩<rt>ばん</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>に<ruby>肉<rt>にく</rt></ruby>を<ruby>食<rt>た</rt></ruby>べました。", "exv": "Bữa tối tôi đã ăn thịt.", "tip": "Hình miếng thịt có thớ. にく là âm On nhưng được dùng như từ thường ngày.", "id": 11}, {"d": "kanji", "src": "Chữ Hán 入門 1–20", "w": "<ruby>好<rt>す</rt></ruby>き", "r": "すき", "hv": "HẢO", "vi": "Thích", "e const DK={kanji:['Chữ Hán','#e08a1e','漢字'],vocab:['Từ vựng','#c42f66','語彙'],gram:['Ngữ pháp','#5d8f1f','文法'],doc:['Đọc hiểu','#0d5a8c','読解'],nghe:['Nghe hiểu','#7b3fa0','聴解']};
const ss={get(k,d){try{const v=localStorage.getItem('fcb2_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('fcb2_'+k,JSON.stringify(v))}catch(e){}}};
let deck=ss.get('deck','all'),side=ss.get('side','jp'),furi=ss.get('furi',false),shuf=ss.get('shuf',true);
let Q=[],qi=0,known=[],miss=[],flipped=false,round=1;
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const plain=h=>String(h||'').replace(/<rt>.*?<\/rt>/g,'').replace(/<[^>]+>/g,'');
function pool(){return CARDS.filter(c=>deck==='all'||c.d===deck)}
function mix(a){a=a.slice();if(shuf)for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(list){Q=mix(list||pool()).map(c=>c.id);qi=0;known=[];miss=[];flipped=false;render()}
function renderDecks(){const all=CARDS.length;$('#decks').innerHTML=`<button class="dk${deck==='all'?' on':''}" data-d="all" type="button">Tất cả <span>${all}</span></button>`+Object.entries(DK).map(([k,[n,c]])=>`<button class="dk${deck===k?' on':''}" data-d="${k}" type="button"><i style="background:${c}"></i>${n} <span>${CARDS.filter(x=>x.d===k).length}</span></button>`).join('');
 $('#side').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===side));$('#tFuri').classList.toggle('on',furi);$('#tShuf').classList.toggle('on',shuf);
 document.body.classList.toggle('nofuri',!furi)}
function wcls(c){if(c.d==='gram')return'g';const n=plain(c.w).length;return n>7?'l':n>4?'m':''}
function front(c){const [n,col]=DK[c.d];const img=c.img&&IMGS[c.img];
 let body;if(side==='jp'){body=`<div class="fw ${wcls(c)}">${c.w}</div><div class="hint">${c.d==='gram'?'Mẫu này nghĩa là gì? Dùng khi nào?':'Đọc thế nào? Nghĩa là gì?'}</div>`}
 else{body=`${img?`<img class="pic" src="${img}" alt="">`:''}<div class="fvi">${esc(c.vi)}</div><div class="hint">${c.d==='gram'?'Mẫu ngữ pháp tiếng Nhật là gì?':'Tiếng Nhật là gì? Viết thế nào?'}</div>`}
 return `<div class="face front"><div class="ftop"><span class="pill" style="background:${col}">${n}</span><span class="src">${esc(c.src)}</span><span class="no">${qi+1}/${Q.length}</span></div><div class="fmain">${body}</div></div>`}
function back(c){const [n,col]=DK[c.d];const img=c.img&&IMGS[c.img];
 const g=c.d==='gram';
 return `<div class="face back"><div class="ftop"><span class="pill" style="background:${col}">${n}</span><span class="src">${esc(c.src)}</span><span class="no">${qi+1}/${Q.length}</span></div>
 <div class="bw">${img?`<img class="pic s" src="${img}" alt="">`:''}<div class="t"><div class="bword${g?' g':''}">${c.r&&!g?c.w.replace(/<rt>.*?<\/rt>/g,''):c.w}</div>${c.r?`<div class="bread">${esc(c.r)}</div>`:''}${c.hv?`<div class="hv">${esc(c.hv)}</div>`:''}<div class="bvi">${esc(c.vi)}</div></div></div>
 ${g&&c.st&&c.st.length?`<div class="blk"><div class="lb">Cấu trúc</div><div class="st">${c.st.join('<br>')}</div></div>`:''}
 ${c.ex?`<div class="blk"><div class="lb">Ví dụ</div><div class="ej">${c.ex}</div><div class="ev">${esc(c.exv)}</div></div>`:''}
 ${c.tip?`<div class="blk tip">💡 ${esc(c.tip)}</div>`:''}</div>`}
function render(){renderDecks();const M=$('#main');
 if(qi>=Q.length){return result()}
 const c=CARDS[Q[qi]];
 M.innerHTML=`<div class="prog"><div class="bar"><i style="width:${qi/Q.length*100}%"></i></div><span class="cnt">${round>1?'Ôn lại · ':''}<b>${qi+1}</b>/${Q.length} · <span class="k">✓ ${known.length}</span> · <span class="n">✗ ${miss.length}</span></span></div>
 <div class="scene"><div class="card${flipped?' flip':''}" id="card">${front(c)}${back(c)}</div></div>
 <div class="acts" id="acts"></div>
 <div class="small"><span>Phím tắt: Space lật · ← chưa nhớ · → đã nhớ</span><button id="bRe" type="button">↺ Làm lại từ đầu</button></div>`;
 acts();$('#card').onclick=flip;$('#bRe').onclick=()=>{round=1;start()};swipe($('#card'))}
function acts(){$('#acts').innerHTML=flipped?`<button class="bng" id="bN" type="button">✗ Chưa nhớ <kbd>←</kbd></button><button class="bok" id="bK" type="button">✓ Đã nhớ <kbd>→</kbd></button>`:`<button class="bflip" id="bF" type="button">Lật thẻ <kbd>Space</kbd></button>`;
 if(flipped){$('#bN').onclick=()=>grade(false);$('#bK').onclick=()=>grade(true)}else $('#bF').onclick=flip}
function flip(){flipped=!flipped;$('#card').classList.toggle('flip',flipped);acts()}
function grade(ok){if(!flipped)return;(ok?known:miss).push(Q[qi]);qi++;flipped=false;render()}
function result(){const t=known.length+miss.length,p=t?Math.round(known.length/t*100):0,col=p>=80?'#1d7a4b':p>=50?'#e08a1e':'#b3261e';
 const by=Object.keys(DK).map(k=>{const a=[...known,...miss].filter(i=>CARDS[i].d===k);if(!a.length)return'';const ok=a.filter(i=>known.includes(i)).length;return `<span style="display:inline-block;margin:3px 6px;font-weight:700"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${DK[k][1]}"></i> ${DK[k][0]} ${ok}/${a.length}</span>`}).join('');
 $('#main').innerHTML=`<div class="res"><div class="ring" style="background:conic-gradient(${col} ${p*3.6}deg,#e6ebef 0)"><span style="color:${col}">${p}%</span></div>
 <h2>${p>=80?'Rất tốt! 🎉':p>=50?'Khá ổn, ôn thêm chút nữa nhé!':'Cần ôn lại kỹ hơn nhé!'}</h2><p>Đã nhớ ${known.length} / ${t} thẻ</p><div>${by}</div>
 ${miss.length?`<div class="rows">${miss.map(i=>{const c=CARDS[i];return `<div class="rw"><span class="w">${c.d==='gram'?'<span class="mix" style="font-size:15px">'+c.w+'</span>':c.w}</span><span class="v">${esc(c.r?c.r+' · ':'')}${esc(c.vi)}</span></div>`}).join('')}</div>`:''}
 <div class="rbt">${miss.length?`<button class="p" id="bMiss" type="button">Ôn lại ${miss.length} thẻ chưa nhớ</button>`:''}<button class="s" id="bAll" type="button">Làm lại từ đầu</button></div></div>`;
 if(miss.length)$('#bMiss').onclick=()=>{round++;start(miss.map(i=>CARDS[i]))};$('#bAll').onclick=()=>{round=1;start()}}
function swipe(el){let x0=null,y0=0;el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
 el.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)&&flipped){e.preventDefault();grade(dx>0)}x0=null})}
document.addEventListener('keydown',e=>{if(qi>=Q.length)return;if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}else if(e.key==='ArrowLeft'||e.key==='1')grade(false);else if(e.key==='ArrowRight'||e.key==='2')grade(true)});
$('#decks').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;deck=b.dataset.d;ss.set('deck',deck);round=1;start()};
$('#side').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;side=b.dataset.s;ss.set('side',side);flipped=false;render()};
$('#tFuri').onclick=()=>{furi=!furi;ss.set('furi',furi);renderDecks()};
$('#tShuf').onclick=()=>{shuf=!shuf;ss.set('shuf',shuf);round=1;start()};
start();
</script></body></html>
